name: max-bot

services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:?Set MAX_BOT_TOKEN in .env}"
      MAX_RECEIVE_MODE: "${MAX_RECEIVE_MODE:-polling}"
      MAX_WEBHOOK_SECRET: "${MAX_WEBHOOK_SECRET:-}"
      MAX_WEB_USER: "${MAX_WEB_USER:?Set MAX_WEB_USER in .env}"
      MAX_WEB_PASSWORD: "${MAX_WEB_PASSWORD:?Set MAX_WEB_PASSWORD in .env}"
      MAX_AUTO_START: "${MAX_AUTO_START:-true}"
    ports:
      - "127.0.0.1:${MAX_WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - type: bind
        source: ./config.ini
        target: /app/config.ini
        bind:
          create_host_path: false
      - type: bind
        source: ./channels.txt
        target: /app/channels.txt
        bind:
          create_host_path: false
      - type: bind
        source: ./recipients.txt
        target: /app/recipients.txt
        bind:
          create_host_path: false
      - type: bind
        source: ./keywords.json
        target: /app/keywords.json
        bind:
          create_host_path: false
      - type: bind
        source: ./keywords.txt
        target: /app/keywords.txt
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
