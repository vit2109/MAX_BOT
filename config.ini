[monitor]
; Базовая пауза при временных ошибках API, секунды
interval_seconds = 5
channel_timeout = 30
; Сколько ключевых слов должно совпасть, чтобы отправить сообщение
min_keyword_hits = 1
; Отправка совпадений через официальный Bot API MAX
send_enabled = true
; Слать только критические аварийные сообщения
send_only_critical = false
